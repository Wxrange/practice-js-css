<!--Ctrl + A selects all code -->
<!-- Variable is a container-->
<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
  </head>
  <body>
    <button onclick="one()">1</button>
    <button onclick="two()">2</button>
    <button onclick="three()">3</button>
    <button onclick="plus()">+</button>
    <button onclick="equals()">=</button>
    <script>
      // value will be stored in one string
      let calculation ="";
      function one(){
        calculation += "1";
        console.log(`${calculation}`);
      }
      function two(){
        calculation +="2";
        console.log(`${calculation}`);
      }
      function three(){
        calculation +="3";
        console.log(`${calculation}`);
      }
      function plus(){
        calculation += " + ";
        console.log(`${calculation}`);
      }
      function equals(){
        console.log(eval(calculation));
      }

      let name = "Bill";
      console.log(`My name is: ${name}`);
      let cost = (1*5)+(2*3)+(1*9);
      console.log(`Cost of food: ${cost}`);
      let tax = cost * .1;
      console.log(`Tax (10%) ${tax}`);
    </script>
  </body>




</html>
