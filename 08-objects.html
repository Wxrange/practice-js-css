<!DOCTYPE html>
<html>
  <head>
    <title>Objects</title>
  </head>
  <body>
    <script>
      const product = {
        // "name" is the property
        // 'socks' is the value
        // property value pairs are seperated with a comman
        name: 'socks',
        price: 4.99,
        count:4,
    
      };
      
      console.log(product);
      console.log(product.price);
      console.count(product);
      console.count(product);
      // Reassigning object values
      // "product.name" DOT notation
      product.name = 'cotten socks';
      product.price = '6.59';
      product.count = '8';
      console.log(product);
      //Adding a object property value pair
      product.taxesProduct = .05;
      console.log(product.taxesProduct);
      //Removing a object property value pair
      delete product.taxesProduct;
      console.log(product.taxesProduct);

      // Objects let us group multiple value together
      // Objects let us use multiple values together

      

      
    </script>
  </body>
</html>
