<!DOCTYPE html>
<html>
  <head>
    <title>Booleans Game</title>
  </head>
  <body>
    <h2>Rock Paper Sissors Game</h2>
    <button onclick="playGame('rock')">Rock</button>
    <button onclick="playGame('paper')">Paper</button>
    <button onclick="playGame('scissors')
      ">Scissors</button>
    <button onclick="gameResultRecord.wins = 0;
          gameResultRecord.losses = 0;
          gameResultRecord.ties = 0;
          // TO REMOVE a item from localStorage
          localStorage.removeItem('gameResultRecord');">Reset Score</button>  
    
    <script>
      //STRATEGY for programming in Javascript
      // First figure out the steps of the algorithm
      // Build the algorithm
      // following code line by line is called tracing the code

      // 2-3) TO ACCESS convert back to object
      // 4) if score is removed set a default
      // null is a false value
      // || defualt operator if value true it will be the first value if value false then second operation
      // check if gameResultRecord is false/null
      let gameResultRecord =  JSON.parse(localStorage.getItem('gameResultRecord')) || {
        wins: 0,
        losses: 0,
        ties: 0,
      };
      
      // Randomizes computer choice
      function computerRandomChoice(){
        let computerChoice = ''; 
        let randomNumber = Math.random();
        if(randomNumber >= 0 && randomNumber < 1/3){
          computerChoice='rock';
        } else if (randomNumber >= 1/3 && randomNumber < 2/3){
          computerChoice='paper';
        } else if (randomNumber >= 2/3) {
          computerChoice='scissors';
        }
        // return value (or anything that results in a value)
        // return will return undefined
        // return statement ends function immediately
        return computerChoice;
      }
      //TO ACCESS localStorage use method getItem("name");
      function playGame(userChoice){
        const computerChoice = computerRandomChoice();
        let result = '';
        if(userChoice ==='rock'){
          if(computerChoice === 'rock'){
            result='You Tie.';
            gameResultRecord.ties +=1;
          }else if(computerChoice === 'paper'){
            result='You Lose.';
            gameResultRecord.losses +=1;
          }else if(computerChoice === 'scissors'){
            result='You Win.';
            gameResultRecord.wins +=1;
          }
          
        } else if (userChoice === 'paper'){
          if(computerChoice === 'rock'){
            result='You Win.';
            gameResultRecord.wins +=1;
          }else if(computerChoice === 'paper'){
            result='You Tie.';
            gameResultRecord.ties +=1;
          }else if(computerChoice === 'scissors'){
            result='You Lose.';
            gameResultRecord.losses +=1;
          } 
          
        } else if(userChoice === 'scissors'){
          if(computerChoice === 'rock'){
            result='You Lose.';
            gameResultRecord.losses +=1;
          }else if(computerChoice === 'paper'){
            result='You Win.';
            gameResultRecord.wins +=1;

          }else if(computerChoice === 'scissors'){
            result='You Tie.';
            gameResultRecord.ties +=1;
          }
        }
        //Built-In Object localStorage
        //saves string values more permanently
        // Variables are Temporary / once refresh or close page all the variables are deleted
        //First initialize object, second save strinifyed object, finally remove object proptires and replace with JSON parsed
        // 1) TO SAVE use method setItem("name", "value");
        localStorage.setItem('gameResultRecord', JSON.stringify(gameResultRecord));
        alert(`You picked ${userChoice}. Computer picked ${computerChoice}. ${result}\nWins: ${gameResultRecord.wins}, Losses: ${gameResultRecord.losses}, Ties: ${gameResultRecord.ties}`);
      }
    
    </script>
  </body>
</html>
