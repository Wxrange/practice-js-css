<!DOCTYPE html>
<html>
  <head>
    <title>Booleans Game</title>
  </head>
  <body>
    <h2>Rock Paper Sissors Game</h2>
    <button onclick="playGame('rock')">Rock</button>
    <button onclick="playGame('paper')">Paper</button>
    <button onclick="playGame('scissors')
      ">Scissors</button>
    <button onclick="resetScore()">New Game</button>  
    
    <script>
      //Strategy for Javascript
      // First figure out the steps of the algorithm
      // Build the algorithm
      // following code line by line is called tracing the code
      // Randomizes computer choice


      /*
      Step 1: save wins loses and ties in a object
      Step 2: print out wins, loses, and ties in a alert 
      Step 3: add a reset button to put wins, loses, and ties back to 0
      Step 4: permently store game results even after tab refresh perserving score until you select to start a new game 
      */
      // global scope score to be able to not clear score values every match
      
      // Fix Initialization from hardcoeded to using || logic operator for setting default to initialize values
      // This is do to null being a falsy value (treated as false)
      // null is to be initially set to be empty
      
      // || default operator
      let savedScore = (JSON.parse(localStorage.getItem('score'))) || {
        wins: 0,
        losses: 0,
        ties : 0
      };

    
    
      console.log(savedScore);

      function computerRandomChoice(){
        let computerChoice = ''; 
        let randomNumber = Math.random();
        if(randomNumber >= 0 && randomNumber < 1/3){
          computerChoice='rock';
        } else if (randomNumber >= 1/3 && randomNumber < 2/3){
          computerChoice='paper';
        } else if (randomNumber >= 2/3) {
          computerChoice='scissors';
        }
        // return value (or anything that results in a value)
        // return will return undefined
        // return statement ends function immediately
        return computerChoice;

        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');      
      }
      

      function playGame(userChoice){
        const computerChoice = computerRandomChoice();
        let result;
        if(userChoice ==='rock'){
          if(computerChoice === 'rock'){
            result='You Tie.';
          }else if(computerChoice === 'paper'){
            result='You Lose.';
          }else if(computerChoice === 'scissors'){
            result='You Win.';
          }
          
        } else if (userChoice === 'paper'){
          if(computerChoice === 'rock'){
            result='You Win.';
          }else if(computerChoice === 'paper'){
            result='You Tie.';
          }else if(computerChoice === 'scissors'){
            result='You Lose.';
          } 
          
        } else if(userChoice === 'scissors'){
          if(computerChoice === 'rock'){

          }else if(computerChoice === 'paper'){
            result='You Win.';
          }else if(computerChoice === 'scissors'){
            result='You Tie.';
          }
        }
        if (result === 'You Win.'){
          score.wins+=1;
        }else if(result === 'You Lose.'){
          score.losses +=1;
        }
        else if(result === 'You Tie.'){
          score.ties +=1;
        }
        
        // Local Storage allows for perment storage of data unless explicity stated otherwise
        // Local Storage only stores strings
        
        localStorage.setItem('score', JSON.stringify(score));
        

        alert(`Match Results: Computer picked ${computerChoice} You picked ${userChoice} ${result} 
Scoreboard: Wins: ${score.wins} Losses: ${score.losses} Ties: ${score.ties}`);
      }
