<!DOCTYPE html>
<html>
  <head>
    <title>Booleans Game</title>
  </head>
  <body>
    <h2>Rock Paper Sissors Game</h2>
    <button onclick="playGame('rock')">Rock</button>
    <button onclick="playGame('paper')">Paper</button>
    <button onclick="playGame('scissors')
      ">Scissors</button>
    <p class="game-results"></p>
    <p class="moves"></p>
    <p class="scoreboard"></p>
    <button onclick="resetScore()">New Game</button>  
    
    <script>
      //Strategy for Javascript
      // First figure out the steps of the algorithm
      // Build the algorithm
      // following code line by line is called tracing the code
      // Randomizes computer choice
      // Need paragraph for game title header
      // Need buton for rock, paper, and sicssors
      // Need computer random choice
      // Need to save wins, loses, and ties in scoreboard
      // Need to show the results for each game with paragraph and choices you and the computer made with another paragraph 
      // Need a button for resetting score
      
      // || default operator
      let score = (JSON.parse(localStorage.getItem('score'))) || {
        wins: 0,
        losses: 0,
        ties : 0
      };
      let scoreboardParagraph = document.querySelector('.scoreboard');
      updateScoreboardElement();
    
    
      console.log(savedScore);

      function computerRandomChoice(){
        let computerChoice = ''; 
        let randomNumber = Math.random();
        if(randomNumber >= 0 && randomNumber < 1/3){
          computerChoice='rock';
        } else if (randomNumber >= 1/3 && randomNumber < 2/3){
          computerChoice='paper';
        } else if (randomNumber >= 2/3) {
          computerChoice='scissors';
        }
    
        return computerChoice;
      }
      function resetScore(){
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score'); 
        updateScoreboardElement();

        
      }
      

      function playGame(userChoice){
        const computerChoice = computerRandomChoice();
        let result;
        if(userChoice ==='rock'){
          if(computerChoice === 'rock'){
            result='You Tie.';
          }else if(computerChoice === 'paper'){
            result='You Lose.';
          }else if(computerChoice === 'scissors'){
            result='You Win.';
          }
          
        } else if (userChoice === 'paper'){
          if(computerChoice === 'rock'){
            result='You Win.';
          }else if(computerChoice === 'paper'){
            result='You Tie.';
          }else if(computerChoice === 'scissors'){
            result='You Lose.';
          } 
          
        } else if(userChoice === 'scissors'){
          if(computerChoice === 'rock'){
            result='You Lose.';
          }else if(computerChoice === 'paper'){
            result='You Win.';
          }else if(computerChoice === 'scissors'){
            result='You Tie.';
          }
        }
        if (result === 'You Win.'){
          score.wins+=1;
        }else if(result === 'You Lose.'){
          score.losses +=1;
        }
        else if(result === 'You Tie.'){
          score.ties +=1;
        }
        

        localStorage.setItem('score', JSON.stringify(score));
        // instead of alert change the match results, player moves, and score to show up on the screen
        updateScoreboardElement();
        document.querySelector('.game-results')
          .innerHTML = `Match Results: Computer picked ${computerChoice} You picked ${userChoice}`;
      
        document.querySelector('.moves')
          .innerHTML = `${result}`;
      }
      // scoreboard function creates and updates the scoreboard paragraph text
      function updateScoreboardElement() {
        scoreboardParagraph
          .innerHTML = ` Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`
      }
    </script>
  </body>
</html>
